rules = [
  UseNamedParameters,
  DisableSyntax,
  OrganizeImports,
  RedundantSyntax,
  ExplicitResultTypes,
  RemoveUnused,
  "file:scalafix-rules/SliceRules.scala"
]

RemoveUnused {
  imports = false
  privates = true
  locals = true
  patternvars = true
}

UseNamedParameters {
  minParams = 3
  skipSingleAlphabet = true
}

DisableSyntax {
  noUniversalEquality = true
  noThrows = true
  noNulls = true
  noAsInstanceOf = true
  noIsInstanceOf = true
  noVars = true
  noWhileLoops = true
  noReturns = true
  noDefaultArgs = true
  regex = [
    {
      id = "noChainingSyntax"
      pattern = "import\\s+scala\\.util\\.chaining"
      message = "scala.util.chaining is banned. Write the step as a method on the type being threaded, or a val."
    }
  ]
}

OrganizeImports {
  groupedImports = Keep
  coalesceToWildcardImportThreshold = 4
  expandRelative = true
  blankLines = Auto
  groups = [
    "re:javax?\\."
    "scala."
    "slicer."
    "*"
  ]
  targetDialect = Scala3
}
