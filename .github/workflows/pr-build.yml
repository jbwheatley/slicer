name: PR Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Cache the sbt build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sbt/v2
          key: ${{ runner.os }}-sbt-cache-${{ github.job }}-${{ hashFiles('**/*.scala', '**/*.sbt', 'project/build.properties') }}
          restore-keys: ${{ runner.os }}-sbt-cache-${{ github.job }}-
      - name: Check formatting, headers and scalafix rules
        run: sbt lintCheck

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Cache the sbt build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sbt/v2
          key: ${{ runner.os }}-sbt-cache-${{ github.job }}-${{ hashFiles('**/*.scala', '**/*.sbt', 'project/build.properties') }}
          restore-keys: ${{ runner.os }}-sbt-cache-${{ github.job }}-
      - name: Setup coursier
        uses: coursier/setup-action@v1
      - name: Build the corpuses the suites index
        run: ./scripts/build-corpuses.sh --rebuild --corpus test-project --corpus test-project-213
      - name: Compile and run every suite
        run: sbt testCheck

  emitted-sbt-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Cache the sbt build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sbt/v2
          key: ${{ runner.os }}-sbt-cache-${{ github.job }}-${{ hashFiles('**/*.scala', '**/*.sbt', 'project/build.properties') }}
          restore-keys: ${{ runner.os }}-sbt-cache-${{ github.job }}-
      - name: Setup coursier
        uses: coursier/setup-action@v1
      - name: Build the corpuses the slices come from
        run: ./scripts/build-corpuses.sh --rebuild --tool sbt
      - name: Compile a slice through the sbt build emitted beside it
        run: sbt checkEmittedSbtBuild

  emitted-mill-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Cache the sbt build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sbt/v2
          key: ${{ runner.os }}-sbt-cache-${{ github.job }}-${{ hashFiles('**/*.scala', '**/*.sbt', 'project/build.properties') }}
          restore-keys: ${{ runner.os }}-sbt-cache-${{ github.job }}-
      - name: Setup coursier
        uses: coursier/setup-action@v1
      - name: Build the corpuses the slices come from
        run: ./scripts/build-corpuses.sh --rebuild --tool sbt
      - name: Build the mill corpus the suite indexes
        run: ./scripts/build-corpuses.sh --rebuild --tool mill --corpus test-project-213
      - name: Compile a slice through the mill build emitted beside it
        run: sbt checkEmittedMillBuild

  example:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Cache the sbt build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sbt/v2
          key: ${{ runner.os }}-sbt-cache-${{ github.job }}-${{ hashFiles('**/*.scala', '**/*.sbt', 'project/build.properties') }}
          restore-keys: ${{ runner.os }}-sbt-cache-${{ github.job }}-
      - name: Publish the plugins locally for the example project
        run: sbt publishLocal
      - name: Build the example project with sbt
        run: sbt compile
        working-directory: example
      - name: Build the example project with mill
        run: ./mill compile
        working-directory: example

  corpus-slices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Cache the sbt build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sbt/v2
          key: ${{ runner.os }}-sbt-cache-${{ github.job }}-${{ hashFiles('**/*.scala', '**/*.sbt', 'project/build.properties') }}
          restore-keys: ${{ runner.os }}-sbt-cache-${{ github.job }}-
      - name: Setup coursier
        uses: coursier/setup-action@v1
      - name: Build the corpuses that get sliced
        run: ./scripts/build-corpuses.sh --rebuild --tool sbt --corpus test-project --corpus test-project-213
      - name: Compile a standalone slice of every corpus definition
        run: sbt corpusCheck/checkCorpusSlices
